
name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          APP_DIR=$(find /tmp/project -type d -name app -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$APP_DIR")
          cp -a "$PROJECT_ROOT"/. .

          echo "Project extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project
        run: |
          test -d app
          test -f gradlew
          test -f settings.gradle -o -f settings.gradle.kts
          echo "Project verification successful"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jawaker-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
