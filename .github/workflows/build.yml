
name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط المشروع
      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP file not found"
            exit 1
          fi

          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          APP_DIR=$(find /tmp/project -type d -name app -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app folder not found inside ZIP"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$APP_DIR")

          cp -a "$PROJECT_ROOT"/. .

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "Project extracted successfully"

      # 3. إعداد Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. إعداد Android SDK وقبول التراخيص
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 5. تثبيت أدوات Android المطلوبة
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. التأكد من وجود التطبيق
      - name: Verify project files
        run: |
          test -d app
          test -f gradlew
          echo "Android project files found"

      # 7. بناء APK
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 8. رفع APK للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jawaker-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
